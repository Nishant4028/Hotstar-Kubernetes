---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotstar-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: hotstar
  template:
    metadata:
      labels:
        app: hotstar
    spec:
      containers:
      - name: hotstar-container
        image: nishant4028/hotstar:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: hotstar-service
spec:
  type: ClusterIP
  selector:
    app: hotstar
  ports:
  - port: 80
    targetPort: 3000
    
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-ssl
  annotations:
    #kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: letsencrypt    
spec:
  ingressClassName: nginx
  rules:
    - host: hotstar.nishantg.shop
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hotstar-service
                port: 
                  number: 80
                       
  tls:
  - hosts:
    - hotstar.nishantg.shop
    secretName: hotstar-nishantg-secret    
